name: Publish Backend Image to ACR

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Generate unique version tag based on date + run number
      - name: Generate image tag
        id: vars
        run: echo "TAG=$(date +'%Y%m%d')-${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      # Login to Azure Container Registry
      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      # Build and push image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/myapp-backend:${{ env.TAG }}
            ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/myapp-backend:latest

      # Output version for visibility
      - name: Show pushed tag
        run: echo "Pushed tag: ${{ env.TAG }} to ACR"